<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenGUI-Plus 控制台</title>
<style>
  :root {
    --bg: #f4f6fb;
    --surface: #ffffff;
    --surface-soft: #f8faff;
    --border: #e3e8f2;
    --text: #1b2130;
    --muted: #6c7690;
    --accent: #4f46e5;
    --accent-soft: #eef0ff;
    --green: #12a150;
    --amber: #d98008;
    --red: #d92d20;
    --radius: 16px;
    --shadow: 0 10px 30px rgba(24, 35, 71, 0.08);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: linear-gradient(160deg, #eef1fb 0%, #f7f9fd 45%, #f4f6fb 100%);
    color: var(--text);
    font: 14px/1.6 "PingFang SC", "Microsoft YaHei", -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  button, input, select, textarea { font: inherit; color: inherit; }

  .shell { display: grid; grid-template-columns: 232px 1fr; height: 100vh; }

  /* ---------- sidebar ---------- */
  aside {
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(14px);
    border-right: 1px solid var(--border);
    padding: 18px 14px;
    overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 11px; flex: none;
    background: linear-gradient(140deg, #6d5efc, #4f46e5 55%, #7c3aed);
    box-shadow: 0 6px 16px rgba(79,70,229,.35);
    display: grid; place-items: center; color: #fff; font-weight: 700;
  }
  .brand h1 { font-size: 15px; margin: 0; letter-spacing: .2px; }
  .brand small { display: block; color: var(--muted); font-size: 11px; font-weight: 400; }

  .nav-group { font-size: 11px; color: var(--muted); padding: 12px 10px 6px; letter-spacing: .6px; }
  .nav-item {
    display: flex; align-items: center; gap: 9px; width: 100%;
    padding: 9px 11px; margin-bottom: 3px; border: 0; border-radius: 11px;
    background: transparent; cursor: pointer; text-align: left; font-size: 13px;
    transition: background .15s, color .15s;
  }
  .nav-item:hover { background: var(--surface-soft); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav-item .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); flex: none; }
  .nav-item.healthy .dot { background: var(--green); }
  .nav-item.broken .dot { background: var(--amber); }
  .nav-item .count { margin-left: auto; font-size: 11px; color: var(--muted); }

  /* ---------- main ---------- */
  main { display: flex; flex-direction: column; min-width: 0; }
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 14px 22px; border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,0.72); backdrop-filter: blur(14px);
  }
  header h2 { margin: 0; font-size: 16px; }
  header .spacer { flex: 1; }

  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 12px; border-radius: 999px; font-size: 12px;
    background: var(--surface); border: 1px solid var(--border);
  }
  .pill b { font-weight: 600; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .status-dot.on { background: var(--green); box-shadow: 0 0 0 3px rgba(18,161,80,.16); }
  .status-dot.off { background: var(--red); }
  .status-dot.warn { background: var(--amber); }

  select.project, .btn, input, textarea, select {
    border: 1px solid var(--border); border-radius: 10px; padding: 7px 11px;
    background: var(--surface); outline: none;
  }
  select.project { min-width: 190px; }
  .btn {
    cursor: pointer; background: var(--surface); font-weight: 500;
    transition: transform .08s, box-shadow .15s, background .15s;
  }
  .btn:hover { box-shadow: 0 4px 12px rgba(24,35,71,.10); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: linear-gradient(140deg,#6d5efc,#4f46e5); border-color: transparent; color: #fff; }
  .btn.ghost { background: transparent; }
  .btn.danger { color: var(--red); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .content { flex: 1; overflow-y: auto; padding: 20px 22px 40px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); align-items: start; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px;
  }
  .card h3 { margin: 0 0 4px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .card h3 .spacer { flex: 1; }
  .card p.hint { margin: 0 0 12px; color: var(--muted); font-size: 12px; }

  .fields { display: grid; gap: 9px; margin-bottom: 12px; }
  .field { display: grid; gap: 4px; }
  .field label { font-size: 12px; color: var(--muted); }
  .field input, .field select, .field textarea { width: 100%; }
  .field textarea { min-height: 74px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
  .field .row { display: flex; align-items: center; gap: 8px; }
  .field .row input[type=checkbox] { width: auto; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  pre.output {
    margin: 10px 0 0; padding: 12px; border-radius: 12px; max-height: 340px; overflow: auto;
    background: #101828; color: #d7e0f5; font-size: 12px; line-height: 1.55;
    font-family: ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word;
  }
  pre.output.error { background: #3a1414; color: #ffd9d9; }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 11.5px; }
  tbody tr:hover { background: var(--surface-soft); }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 11px; margin-right: 4px; }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); font-size: 12.5px; padding: 10px 0; }

  .log { max-height: 220px; overflow-y: auto; font-size: 12px; }
  .log div { padding: 4px 0; border-bottom: 1px dashed var(--border); }
  .log .t { color: var(--muted); margin-right: 8px; }

  .toast {
    position: fixed; right: 20px; bottom: 20px; z-index: 50;
    display: grid; gap: 8px; max-width: 380px;
  }
  .toast div {
    background: #101828; color: #fff; padding: 10px 14px; border-radius: 12px;
    box-shadow: 0 10px 26px rgba(16,24,40,.28); font-size: 12.5px;
  }
  .toast div.err { background: #7a1414; }

  /* ---------- method browser (generated from the live registry) ---------- */
  .method-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .method-bar select { min-width: 260px; }
  .method-summary { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
  .qr {
    display: block; background: #fff; border: 1px solid var(--border); border-radius: 12px;
    padding: 10px; margin: 8px 0; image-rendering: pixelated; width: 220px; height: 220px;
  }
  pre.ascii {
    margin: 8px 0; padding: 6px 8px; border-radius: 10px; background: #fff;
    border: 1px solid var(--border); font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 6px; line-height: 6px; letter-spacing: 0; overflow: auto; white-space: pre;
  }
  .shots { display: flex; gap: 10px; flex-wrap: wrap; margin: 8px 0; }
  .shots img {
    width: 180px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface-soft); cursor: zoom-in;
  }
  .badge {
    display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px;
    background: var(--surface-soft); border: 1px solid var(--border); color: var(--muted); margin-left: 6px;
  }
  .code-inline { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; color: var(--muted); }
  details.raw { margin-top: 8px; }
  details.raw summary { cursor: pointer; font-size: 12px; color: var(--muted); }
  .sect { font-size: 12px; color: var(--muted); margin: 18px 0 8px; letter-spacing: .4px; }
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand">
      <div class="brand-mark">+</div>
      <div>
        <h1>OpenGUI-Plus</h1>
        <small>OpenGUI 增强版控制台</small>
      </div>
    </div>
    <div id="nav"></div>
  </aside>

  <main>
    <header>
      <h2 id="panel-title">概览</h2>
      <div class="spacer"></div>
      <span class="pill"><span class="status-dot" id="conn-dot"></span><b id="conn-text">未连接</b></span>
      <span class="pill">项目 <b><select class="project" id="project-select"></select></b></span>
      <span class="pill"><span class="status-dot" id="sse-dot"></span>实时事件</span>
      <button class="btn ghost" id="btn-new-project">新建项目组</button>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<datalist id="known-ids"></datalist>

<script>
/* ============================================================
   OpenGUI-Plus console.

   Two layers, both driven by the live registry:

   1. CURATED — hand-written quick actions for the flows people run every
      day (pairing, recording a template, switching project).
   2. Method browser — built from `/api/modules`, which ships every module's
      `methodSpecs`. That is what guarantees all ten modules and all of their
      methods are reachable from here, including the ones no one wrote a card
      for. Adding a method server-side is enough to make it appear.

   Results are rendered by shape: tables for record arrays, an <img> for a
   pairing QR, thumbnails for screenshots, a download button for an exported
   replay, and the raw JSON is always one click away.
   ============================================================ */

const CURATED = {
  'wlan-connection': {
    title: '模块一 · 无线调试连接',
    hint: 'USB / WiFi / 自动三种模式。支持电脑生成二维码让手机扫的反向配对流；配对端口与连接端口是两个不同的端口。',
    views: [
      { label: '连接状态', target: 'wlan-connection.status' },
      { label: '已保存设备', target: 'wlan-connection.listDevices' },
      { label: '探测在线设备', target: 'wlan-connection.discover' },
      { label: 'mDNS 服务', target: 'wlan-connection.mdnsServices' },
      { label: '配对指引', target: 'wlan-connection.pairingGuide' },
    ],
    actions: [
      { label: '生成配对二维码（手机扫）', target: 'wlan-connection.generatePairingQr',
        fields: [ { name:'serviceName', label:'服务名（留空自动生成）' },
                  { name:'code', label:'配对码（留空自动生成 6 位）' } ] },
      { label: '反向配对：出码 → 等手机扫 → 配对 → 连接', target: 'wlan-connection.startQrPairing',
        fields: [ { name:'serviceName', label:'服务名（留空自动生成）' },
                  { name:'timeoutMs', label:'等待扫描超时（毫秒）', type:'number', value:60000 },
                  { name:'connectPort', label:'连接端口（留空走 mDNS 解析）', type:'number' },
                  { name:'connect', label:'配对后顺带连接', type:'checkbox', value:true } ] },
      { label: '用二维码内容配对', target: 'wlan-connection.pairWithQr',
        fields: [ { name:'qr', label:'二维码内容', type:'textarea', required:true,
                    placeholder:'WIFI:T:ADB;S:studio-abc;P:123456;;' } ] },
      { label: '解析二维码内容（不出网不出码）', target: 'wlan-connection.parsePairingQr',
        fields: [ { name:'text', label:'二维码内容', type:'textarea', required:true } ] },
      { label: '设置连接模式', target: 'wlan-connection.setMode',
        fields: [ { name:'mode', label:'模式', type:'select', options:['auto','usb','wifi'], value:'auto' },
                  { name:'autoConnect', label:'启动时自动连接', type:'checkbox', value:true } ] },
      { label: '保存 WiFi 设备', target: 'wlan-connection.saveDevice',
        fields: [ { name:'transport', type:'hidden', value:'wifi' },
                  { name:'host', label:'设备 IP', placeholder:'192.168.1.23', required:true },
                  { name:'port', label:'端口', type:'number', value:5555 },
                  { name:'name', label:'备注名', placeholder:'小米 9' } ] },
      { label: '连接', target: 'wlan-connection.connect',
        fields: [ { name:'mode', label:'模式（留空用当前设置）', type:'select', options:['','auto','usb','wifi'], value:'' } ] },
      { label: '断开', target: 'wlan-connection.disconnect', fields: [] },
      { label: '删除已保存设备', target: 'wlan-connection.removeDevice',
        fields: [ { name:'id', label:'设备 id', required:true },
                  { name:'confirm', label:'确认删除', type:'checkbox', value:true } ] },
    ],
  },
  'snippet-library': {
    title: '模块二 · 快捷指令库',
    hint: '给常用指令起别名，输入别名即可补全，支持按标签分类与 JSON 导入导出。',
    views: [
      { label: '全部指令', target: 'snippet-library.list' },
      { label: '标签概览', target: 'snippet-library.listTags' },
    ],
    actions: [
      { label: '按别名补全', target: 'snippet-library.complete', fields: [ { name:'prefix', label:'前缀', placeholder:'sc' } ] },
      { label: '解析别名', target: 'snippet-library.resolve', fields: [ { name:'alias', label:'别名', placeholder:'sc', required:true } ] },
      { label: '保存指令', target: 'snippet-library.save',
        fields: [ { name:'alias', label:'别名（不含空格）', placeholder:'sc', required:true },
                  { name:'command', label:'完整指令', placeholder:'截屏并返回当前界面', required:true },
                  { name:'tags', label:'标签（逗号分隔）', placeholder:'调试,UI检查' },
                  { name:'description', label:'说明' } ] },
      // `save` doubles as the update entry point: pass `id` to rewrite an
      // existing snippet. There is no separate `update` method.
      { label: '修改指令', target: 'snippet-library.save',
        fields: [ { name:'id', label:'指令 id（留空则按别名新建）' },
                  { name:'alias', label:'别名', required:true },
                  { name:'command', label:'新指令' },
                  { name:'tags', label:'新标签（逗号分隔）' } ] },
      { label: '删除指令', target: 'snippet-library.remove', fields: [ { name:'id', label:'指令 id', required:true } ] },
      { label: '导出 JSON', target: 'snippet-library.exportJson', fields: [] },
      { label: '导入 JSON', target: 'snippet-library.importJson',
        fields: [ { name:'payload', label:'JSON 文本', type:'textarea', required:true, placeholder:'{"version":1,"snippets":[...]}' },
                  { name:'mode', label:'模式', type:'select', options:['merge','replace'], value:'merge' } ] },
    ],
  },
  'action-template': {
    title: '模块三 · 动作模板录制',
    hint: '把一串操作录成模板，之后一键执行；参数用 {{变量名}} 占位，执行时填真实值。',
    views: [
      { label: '模板列表', target: 'action-template.list' },
    ],
    actions: [
      { label: '开始录制', target: 'action-template.startRecording',
        fields: [ { name:'name', label:'模板名', placeholder:'打开设置并截屏', required:true },
                  { name:'description', label:'说明' } ] },
      { label: '录制一步', target: 'action-template.recordStep',
        fields: [ { name:'recordingId', label:'录制会话 id', required:true },
                  { name:'type', label:'步骤类型', type:'select',
                    options:['connect','launch','shell','tap','swipe','input','screenshot','wait','snippet','disconnect'], value:'launch' },
                  { name:'params', label:'参数（JSON）', type:'textarea', placeholder:'{"package":"com.android.settings"}' },
                  { name:'note', label:'备注' } ] },
      { label: '结束录制并保存', target: 'action-template.stopRecording',
        fields: [ { name:'recordingId', label:'录制会话 id', required:true } ] },
      { label: '查看单个模板', target: 'action-template.get', fields: [ { name:'id', label:'模板 id', required:true } ] },
      { label: '执行模板', target: 'action-template.execute',
        fields: [ { name:'id', label:'模板 id', required:true },
                  { name:'variables', label:'变量（JSON）', type:'textarea', placeholder:'{"package":"com.android.settings"}' } ] },
      { label: '删除模板', target: 'action-template.remove', fields: [ { name:'id', label:'模板 id', required:true } ] },
    ],
  },
  'scheduler': {
    title: '模块四 · 定时任务',
    hint: '单次 / 每天 / 每周 / 自定义 Cron。可执行快捷指令、动作模板或完整流程；创建时会校验目标是否存在。',
    views: [
      { label: '任务列表', target: 'scheduler.list' },
      { label: '即将执行', target: 'scheduler.nextRuns', input: { limit: 10 } },
      { label: '执行日志', target: 'scheduler.runs', input: { limit: 20 } },
    ],
    actions: [
      { label: '新建任务', target: 'scheduler.create',
        fields: [ { name:'name', label:'任务名', required:true, placeholder:'每日凌晨构建测试' },
                  { name:'schedule', label:'调度（JSON）', type:'textarea', required:true,
                    placeholder:'{"kind":"daily","at":"02:00"}' },
                  { name:'target', label:'目标（JSON）', type:'textarea', required:true,
                    placeholder:'{"type":"template","templateId":"tpl_xxx"}' },
                  { name:'enabled', label:'立即启用', type:'checkbox', value:true } ] },
      { label: '立即执行', target: 'scheduler.runNow', fields: [ { name:'id', label:'任务 id', required:true } ] },
      { label: '启用', target: 'scheduler.enable', fields: [ { name:'id', label:'任务 id', required:true } ] },
      { label: '停用', target: 'scheduler.disable', fields: [ { name:'id', label:'任务 id', required:true } ] },
      { label: '删除任务', target: 'scheduler.remove', fields: [ { name:'id', label:'任务 id', required:true } ] },
    ],
  },
  'project-group': {
    title: '模块五 · 项目组管理',
    hint: '一个 App 一套配置：设备、指令库、模板、定时任务。切换项目组即切换全套数据。',
    views: [
      { label: '项目组列表', target: 'project-group.list' },
      { label: '当前项目组', target: 'project-group.current' },
    ],
    actions: [
      { label: '新建项目组', target: 'project-group.create',
        fields: [ { name:'name', label:'名称', required:true, placeholder:'抖音项目' },
                  { name:'description', label:'说明' },
                  { name:'tags', label:'标签（逗号分隔）' } ] },
      { label: '切换项目组', target: 'project-group.switch', fields: [ { name:'id', label:'项目组 id', required:true } ] },
      { label: '复制项目组（含全部配置）', target: 'project-group.duplicate',
        fields: [ { name:'id', label:'源项目组 id', required:true }, { name:'name', label:'新名称' } ] },
      { label: '导出项目组', target: 'project-group.export', fields: [ { name:'id', label:'项目组 id', required:true } ] },
      { label: '导入项目组', target: 'project-group.import',
        fields: [ { name:'payload', label:'项目包 JSON', type:'textarea', required:true } ] },
      { label: '删除项目组', target: 'project-group.remove', fields: [ { name:'id', label:'项目组 id', required:true } ] },
    ],
  },
  'demo-recorder': {
    title: '模块六 · 演示录制与教学',
    hint: '手动做一遍，系统记录操作序列与页面状态，可转成动作模板；支持事后修正示范。',
    views: [
      { label: '录制列表', target: 'demo-recorder.listDemos' },
    ],
    actions: [
      { label: '开始演示录制', target: 'demo-recorder.startDemo',
        fields: [ { name:'name', label:'录制名', required:true }, { name:'description', label:'说明' } ] },
      { label: '采集一步', target: 'demo-recorder.captureStep',
        fields: [ { name:'recordingId', label:'录制 id', required:true },
                  { name:'action', label:'动作', placeholder:'tap', required:true },
                  { name:'params', label:'参数（JSON）', type:'textarea', placeholder:'{"x":500,"y":1200}' },
                  { name:'captureScreen', label:'同时抓页面状态', type:'checkbox', value:true },
                  { name:'note', label:'备注' } ] },
      { label: '结束录制', target: 'demo-recorder.stopDemo', fields: [ { name:'recordingId', label:'录制 id', required:true } ] },
      { label: '查看单个录制', target: 'demo-recorder.getDemo', fields: [ { name:'id', label:'录制 id', required:true } ] },
      { label: '修正示范', target: 'demo-recorder.revise',
        fields: [ { name:'id', label:'录制 id', required:true },
                  { name:'steps', label:'修正后的步骤（JSON 数组）', type:'textarea', required:true, placeholder:'[{"action":"tap","params":{"x":1}}]' },
                  { name:'note', label:'修正说明' } ] },
      { label: '转为动作模板（真写入）', target: 'demo-recorder.toTemplate',
        fields: [ { name:'id', label:'录制 id', required:true },
                  { name:'name', label:'模板名（留空用录制名）' },
                  { name:'description', label:'说明（可选覆盖）' } ] },
      { label: '删除录制', target: 'demo-recorder.removeDemo', fields: [ { name:'id', label:'录制 id', required:true } ] },
    ],
  },
  'workflow-marketplace': {
    title: '模块七 · 工作流模板市场',
    hint: '标准 .opengui-workflow 格式，分类浏览、一键安装、评分与导入导出。',
    views: [
      { label: '市场分类', target: 'workflow-marketplace.categories' },
      { label: '浏览模板', target: 'workflow-marketplace.browse' },
      { label: '已安装', target: 'workflow-marketplace.listInstalled' },
    ],
    actions: [
      { label: '按分类浏览', target: 'workflow-marketplace.browse',
        fields: [ { name:'category', label:'分类', type:'select',
                    options:['','social-operations','app-testing','auto-checkin','data-collection','other'], value:'' },
                  { name:'query', label:'关键词' },

let state = { panel: 'overview', modules: [], projects: [], currentProject: null, events: [], ids: [], brokenTargets: [] };

/* ---------------- helpers ---------------- */

async function api(path, options = {}) {
  const response = await fetch(path, options);
  const text = await response.text();
  try { return JSON.parse(text); }
  catch { return { ok: false, error: text.slice(0, 400) }; }
}

/** Recognise the module-level `Result` envelope without mistaking a report for one. */
function isResultEnvelope(value) {
  if (value === null || typeof value !== 'object' || Array.isArray(value)) return false;
  if (typeof value.ok !== 'boolean') return false;
  return value.ok === false ? typeof value.error === 'string' : 'value' in value;
}

async function call(target, input = {}) {
  const result = await api('/api/call', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ target, input }),
  });
  // The registry wraps every dispatch as { ok: true, value: <module result> };
  // a module-level failure therefore arrives as ok:true with an inner Result.
  //
  // The inner check has to be strict: several methods legitimately return a
  // domain object with an `ok` field (an execution report is one). Only a
  // genuine Result carries `value` on success or `error` on failure.
  const candidate = result.value;
  const inner = isResultEnvelope(candidate) ? candidate : null;
  const payload = inner ?? result;
  if (!payload.ok) toast(`${target} 失败：${payload.error ?? '未知错误'}`, true);
  else harvestIds(payload.value);
  return payload;
}

function toast(message, isError = false) {
  const box = document.getElementById('toast');
  const node = document.createElement('div');
  if (isError) node.className = 'err';
  node.textContent = message;
  box.appendChild(node);
  setTimeout(() => node.remove(), isError ? 6000 : 3200);
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, ch => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]
  ));
}

function pretty(value) {
  return escapeHtml(JSON.stringify(value, null, 2));
}

/** Collect ids/aliases seen in results so id inputs can autocomplete. */
function harvestIds(value, depth = 0) {
  if (value === null || value === undefined || depth > 4) return;
  if (Array.isArray(value)) {
    for (const row of value.slice(0, 50)) harvestIds(row, depth + 1);
    return;
  }
  if (typeof value !== 'object') return;
  for (const key of ['id', 'alias', 'recordingId', 'sessionId', 'taskId', 'templateId', 'deviceId', 'experienceId']) {
    const found = value[key];
    if (typeof found === 'string' && found.length > 0 && found.length < 64 && !state.ids.includes(found)) {
      state.ids.push(found);
    }
  }
  for (const nested of Object.values(value)) harvestIds(nested, depth + 1);
}

function syncKnownIds() {
  const list = document.getElementById('known-ids');
  if (!list) return;
  list.innerHTML = state.ids.slice(-200).map(id => `<option value="${escapeHtml(id)}"></option>`).join('');
}

/* ---------------- result rendering ---------------- */

function isImagePath(value) {
  return typeof value === 'string' && /\.(png|jpe?g|webp|gif)$/i.test(value);
}

function qrOf(value) {
  if (value === null || typeof value !== 'object') return null;
  const candidates = [value, value.qr, value.pairing, value.result];
  for (const candidate of candidates) {
    if (candidate && typeof candidate === 'object') {
      if (typeof candidate.dataUrl === 'string' && candidate.dataUrl.startsWith('data:image')) return candidate;
      if (typeof candidate.pngBase64 === 'string' && candidate.pngBase64.length > 0) return candidate;
    }
  }
  return null;
}

function renderQr(qr) {
  const src = typeof qr.dataUrl === 'string' && qr.dataUrl.startsWith('data:image')
    ? qr.dataUrl
    : `data:image/png;base64,${qr.pngBase64}`;
  let body = `<img class="qr" src="${src}" alt="配对二维码">`;
  if (typeof qr.qrText === 'string') {
    body += `<p class="hint"><code class="code-inline">${escapeHtml(qr.qrText)}</code></p>`;
  }
  if (typeof qr.pairingCode === 'string') {
    body += `<p class="hint">配对码 <b>${escapeHtml(qr.pairingCode)}</b>（仅在手机上确认过之后才使用）</p>`;
  }
  if (typeof qr.ascii === 'string') {
    body += `<pre class="ascii">${escapeHtml(qr.ascii)}</pre>`;
  }
  return body;
}

/** Screenshots are served from /files/<relative path under the data dir>. */
function renderShots(value) {
  const paths = [];
  const walk = (node, depth) => {
    if (node === null || node === undefined || depth > 4) return;
    if (Array.isArray(node)) { for (const row of node) walk(row, depth + 1); return; }
    if (typeof node !== 'object') return;
    if (isImagePath(node.screenshotPath)) paths.push(node.screenshotPath);
    if (isImagePath(node.path)) paths.push(node.path);
    for (const nested of Object.values(node)) walk(nested, depth + 1);
  };
  walk(value, 0);
  if (paths.length === 0) return '';
  const unique = [...new Set(paths)].slice(0, 12);
  return `<div class="shots">${unique.map(path =>
    `<img src="/files/${encodeURI(path)}" alt="截图" loading="lazy" onclick="window.open(this.src,'_blank')">`).join('')}</div>`;
}

function renderDownload(value) {
  if (value === null || typeof value !== 'object') return '';
  const content = typeof value.content === 'string' ? value.content : '';
  if (!content.startsWith('<')) return '';
  const filename = typeof value.filename === 'string' ? value.filename : 'export.html';
  return `<div class="row" style="margin:8px 0"><button class="btn primary" data-download="${escapeHtml(filename)}">下载 ${escapeHtml(filename)}</button>
    <button class="btn" data-preview="${escapeHtml(filename)}">新窗口预览</button></div>`;
}

function renderTable(rows) {
  if (rows.length === 0) return '<p class="empty">暂无记录</p>';
  const keys = [...new Set(rows.flatMap(row => (row && typeof row === 'object' ? Object.keys(row) : [])))].slice(0, 8);
  if (keys.length === 0) return `<pre class="output">${pretty(rows)}</pre>`;
  const head = keys.map(key => `<th>${escapeHtml(key)}</th>`).join('');
  const body = rows.slice(0, 60).map(row => {
    const cells = keys.map((key) => {
      const cell = row?.[key];
      const text = cell === null || cell === undefined ? ''
        : typeof cell === 'object' ? JSON.stringify(cell) : String(cell);
      return `<td>${escapeHtml(text.length > 120 ? `${text.slice(0, 120)}…` : text)}</td>`;
    }).join('');
    return `<tr>${cells}</tr>`;
  }).join('');
  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`
    + (rows.length > 60 ? `<p class="hint">仅显示前 60 条，共 ${rows.length} 条</p>` : '');
}

/** Render a module result by shape: QR, screenshots, download, tables, then raw JSON. */
function renderResult(value) {
  if (value === null || value === undefined) return '<p class="empty">无数据</p>';

  if (typeof value === 'string') {
    if (value.startsWith('data:image')) return `<img class="qr" src="${value}" alt="图片">`;
    if (value.trimStart().startsWith('<')) {
      return `<div class="row" style="margin:8px 0"><button class="btn primary" data-download="export.html">下载 HTML</button></div>`
        + `<details class="raw"><summary>原始内容</summary><pre class="output">${escapeHtml(value.slice(0, 4000))}</pre></details>`;
    }
    return `<pre class="output">${escapeHtml(value)}</pre>`;
  }

  if (Array.isArray(value)) return renderTable(value);
  if (typeof value !== 'object') return `<pre class="output">${escapeHtml(String(value))}</pre>`;

  let html = '';
  const qr = qrOf(value);
  if (qr !== null) html += renderQr(qr);
  html += renderShots(value);
  html += renderDownload(value);

  const arrays = Object.entries(value).filter(([, v]) => Array.isArray(v) && v.length > 0);
  const tables = arrays.slice(0, 3);
  for (const [key, rows] of tables) {
    html += `<p class="sect">${escapeHtml(key)} · ${rows.length} 条</p>` + renderTable(rows);
  }

  const scalarOnly = tables.length === 0 && html.length === 0;
  html += scalarOnly
    ? `<pre class="output">${pretty(value)}</pre>`
    : `<details class="raw"><summary>原始 JSON</summary><pre class="output">${pretty(value)}</pre></details>`;
  return html;
}

function paintResult(container, result) {
  container.innerHTML = result.ok
    ? renderResult(result.value)
    : `<pre class="output error">${escapeHtml(result.error ?? '未知错误')}</pre>`;
  const download = container.querySelector('[data-download]');
  if (download !== null) {
    const content = result.value?.content ?? '';
    download.addEventListener('click', () => {
      const blob = new Blob([content], { type: 'text/html;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = download.dataset.download;
      link.click();
      URL.revokeObjectURL(link.href);
    });
  }
  const preview = container.querySelector('[data-preview]');
  if (preview !== null) {
    const content = result.value?.content ?? '';
    preview.addEventListener('click', () => {
      const blob = new Blob([content], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
      setTimeout(() => URL.revokeObjectURL(url), 30_000);
    });
  }
}

/* ---------------- form building ---------------- */

const JSON_FIELDS = new Set(['params','variables','payload','target','schedule','steps','data','context',
  'anomaly','bundle','options','screenState','preconditions','parameters','weekdays','deviceIds','json','input','steps']);
const CSV_FIELDS = new Set(['tags','groups']);
const BOOL_FIELDS = new Set(['enabled','autoConnect','captureScreen','captureScreenshot','worked','ok',
  'required','skipTargetCheck','force','withText','confirm','save','connect']);
const NUM_FIELDS = new Set(['port','score','limit','priority','maxConcurrency','ms','duration','durationMs',
  'x','y','x1','y1','x2','y2','timeoutMs','pollMs','revision','count','index']);
const ID_KEYS = ['id','recordingId','sessionId','taskId','templateId','deviceId','experienceId','projectId','alias','from','to'];

function fieldType(name, hint) {
  if (BOOL_FIELDS.has(name)) return 'checkbox';
  if (NUM_FIELDS.has(name)) return 'number';
  if (CSV_FIELDS.has(name)) return 'text';
  if (JSON_FIELDS.has(name)) return 'textarea';
  if (typeof hint === 'string' && /(JSON|数组|对象|映射|\{)/.test(hint)) return 'textarea';
  if (typeof hint === 'string' && /(是否|true|false)/.test(hint)) return 'checkbox';
  if (/(true|false|是否)/.test(String(hint))) return 'checkbox';
  return 'text';
}

function renderField(field, prefix) {
  const { name, label, hint, type, options, value, required, placeholder } = field;
  const id = `f-${prefix}-${name}`;
  const list = ID_KEYS.includes(name) ? ' list="known-ids"' : '';
  let control;
  if (type === 'hidden') {
    return `<input type="hidden" name="${escapeHtml(name)}" value="${escapeHtml(value ?? '')}">`;
  }
  if (type === 'select') {
    control = `<select id="${id}" name="${escapeHtml(name)}">${options.map(option =>
      `<option value="${escapeHtml(option)}" ${String(option) === String(value ?? '') ? 'selected' : ''}>${escapeHtml(option || '（留空）')}</option>`).join('')}</select>`;
  }
  else if (type === 'textarea') {
    control = `<textarea id="${id}" name="${escapeHtml(name)}" placeholder="${escapeHtml(placeholder ?? hint ?? '')}"></textarea>`;
  }
  else if (type === 'checkbox') {
    control = `<div class="row"><input type="checkbox" id="${id}" name="${escapeHtml(name)}" ${value ? 'checked' : ''}></div>`;
  }
  else {
    control = `<input type="${type === 'number' ? 'number' : 'text'}" id="${id}" name="${escapeHtml(name)}"${list}
      placeholder="${escapeHtml(placeholder ?? hint ?? '')}" value="${escapeHtml(value ?? '')}">`;
  }
  return `<div class="field"><label for="${id}">${escapeHtml(label ?? name)}${required ? ' *' : ''}</label>${control}</div>`;
}

function collectInput(scope) {
  const input = {};
  scope.querySelectorAll('input, select, textarea').forEach((element) => {
    if (!element.name) return;
    if (element.type === 'checkbox') { input[element.name] = element.checked; return; }
    const raw = element.value.trim();
    if (raw.length === 0) return;
    if (element.type === 'number') { input[element.name] = Number(raw); return; }
    if ((element.tagName === 'TEXTAREA' || JSON_FIELDS.has(element.name)) && (raw.startsWith('{') || raw.startsWith('['))) {
      try { input[element.name] = JSON.parse(raw); return; }
      catch { /* leave it as a string; the module reports the error */ }
    }
    if (CSV_FIELDS.has(element.name)) {
      input[element.name] = raw.split(/[,，]/).map(part => part.trim()).filter(Boolean);
      return;
    }
    input[element.name] = raw;
  });
  return input;
}

/* ---------------- navigation ---------------- */

function moduleOf(id) {
  return state.modules.find(module => module.id === id);
}

function renderNav() {
  const nav = document.getElementById('nav');
  const overview = `<button class="nav-item ${state.panel === 'overview' ? 'active' : ''}" data-panel="overview">
      <span class="dot"></span>概览</button>`;
  // Sidebar mirrors the registry, so a module added server-side shows up here.
  const items = state.modules
    .filter(module => module.id !== '__host__')
    .map((module) => {
      const healthy = module.started ? 'healthy' : 'broken';
      return `<button class="nav-item ${state.panel === module.id ? 'active' : ''} ${healthy}" data-panel="${escapeHtml(module.id)}">
        <span class="dot"></span>${escapeHtml(module.name)}
        <span class="count">${module.methods.length}</span></button>`;
    }).join('');
  nav.innerHTML = `<div class="nav-group">总览</div>${overview}<div class="nav-group">功能模块</div>${items}`;
  nav.querySelectorAll('.nav-item').forEach((button) => {
    button.addEventListener('click', () => { state.panel = button.dataset.panel; render(); });
  });
}

  const cards = state.modules.filter(module => module.id !== '__host__').map((module) => {
    const dot = module.started ? 'on' : 'off';
    const methods = module.methods.length;
    return `<div class="card">
      <h3><span class="status-dot ${dot}"></span>${escapeHtml(module.name)}
        <span class="spacer"></span><span class="tag">${methods} 方法</span></h3>
      <p class="hint">${escapeHtml(module.summary)}</p>
      <p class="muted" style="font-size:12px">${escapeHtml(module.health?.detail ?? '')}</p>
      <div class="row" style="margin-top:10px">
        <button class="btn primary" data-goto="${escapeHtml(module.id)}">进入模块</button>
      </div>
    </div>`;
  }).join('');

  const log = state.events.slice(-25).reverse().map((event) => {
    const time = String(event.at ?? '').slice(11, 19);
    return `<div><span class="t">${escapeHtml(time)}</span>

  const broken = state.brokenTargets.length > 0
    ? `<p class="hint" style="color:#b45309">⚠ 有 ${state.brokenTargets.length} 个卡片方法在注册表中不存在：
        <code>${escapeHtml(state.brokenTargets.join('、'))}</code><br>请用下方“方法浏览器”调用，或修正前端卡片。</p>`
    : '';

  return `<div class="grid">
      <div class="card">
        <h3>运行状态</h3>
        <p class="hint">共 ${state.modules.filter(m => m.id !== '__host__').length} 个模块、${totalMethods} 个方法，
          其中 ${state.modules.filter(m => m.started).length} 个已启动。</p>
        <p class="muted" style="font-size:12px">当前项目组：<b>${escapeHtml(state.currentProject ?? 'default')}</b></p>
        ${broken}
        <div class="row" style="margin-top:10px">
          <button class="btn" id="ov-refresh">刷新</button>
          <button class="btn" id="ov-events">拉取最近事件</button>
        </div>
      </div>
      <div class="card">
        <h3>实时事件</h3>
        <p class="hint">模块状态变化、任务执行、设备变更都会出现在这里。</p>
        <div class="log">${log}</div>
      </div>
    </div>
    <div class="grid" style="margin-top:16px">${cards}</div>`;
}

function renderModulePanel(id) {
  const registry = moduleOf(id);
  const curated = CURATED[id] ?? { title: registry?.name ?? id, hint: registry?.summary ?? '', views: [], actions: [] };

  const views = (curated.views ?? []).map((view, index) => `
    <div class="card" data-view="${index}">
      <h3>${escapeHtml(view.label)}<span class="spacer"></span>
        <button class="btn ghost" data-refresh="${index}">刷新</button></h3>
      <p class="hint"><code>${escapeHtml(view.target)}</code></p>
      <div class="out"><p class="empty">点击“刷新”加载</p></div>
    </div>`).join('');

  const actions = (curated.actions ?? []).map((action, index) => `
    <div class="card" data-action="${index}">
      <h3>${escapeHtml(action.label)}</h3>
      <p class="hint"><code>${escapeHtml(action.target)}</code></p>
      <form>
        <div class="fields">${(action.fields ?? []).map(field => renderField(field, `a${index}`)).join('')}</div>
        <div class="row">
          <button type="submit" class="btn primary">执行</button>
          <button type="button" class="btn ghost" data-clear="${index}">清空</button>
        </div>
      </form>
      <div class="out"></div>
    </div>`).join('');

  const specs = registry?.methodSpecs ?? [];
  const options = specs.map(spec =>
    `<option value="${escapeHtml(spec.name)}">${escapeHtml(spec.name)} — ${escapeHtml(spec.summary)}</option>`).join('');

  const browser = `<div class="card" id="method-browser">
      <h3>全部方法<span class="spacer"></span><span class="badge">${specs.length} 个</span></h3>
      <p class="hint">方法列表直接来自服务端注册表，新增方法无需改动前端即可调用。</p>
      <div class="method-bar">
        <select id="method-select">${options || '<option>（未获取到方法清单）</option>'}</select>
        <button class="btn primary" id="method-run">执行</button>
      </div>
      <p class="method-summary" id="method-summary"></p>
      <form id="method-form"><div class="fields" id="method-fields"></div></form>
      <div class="out" id="method-out"></div>
    </div>`;

  return `<p class="hint" style="margin-bottom:14px">${escapeHtml(curated.hint)}</p>
    ${browser}
    ${views.length > 0 ? `<p class="sect">常用数据</p><div class="grid">${views}</div>` : ''}
    ${actions.length > 0 ? `<p class="sect">常用操作</p><div class="grid">${actions}</div>` : ''}`;
}

function render() {
  renderNav();
  const module = moduleOf(state.panel);
  document.getElementById('panel-title').textContent = module
    ? `${module.name} · ${module.id}`
    : '概览';
  const content = document.getElementById('content');
  content.innerHTML = module ? renderModulePanel(state.panel) : renderOverview();
  syncKnownIds();
  if (module) bindModulePanel(state.panel);
  else bindOverview();
}

/* ---------------- binding ---------------- */

function bindModulePanel(id) {
  const curated = CURATED[id] ?? { views: [], actions: [] };

  (curated.views ?? []).forEach((view, index) => {
    const card = document.querySelector(`[data-view="${index}"]`);
    if (card === null) return;
    const out = card.querySelector('.out');
    const load = async () => {
      out.innerHTML = '<p class="empty">加载中…</p>';
      const result = await call(view.target, view.input ?? {});
      paintResult(out, result);
      syncKnownIds();
      if (view.target === 'wlan-connection.status') paintConnection(result.value);
    };
    card.querySelector('[data-refresh]').addEventListener('click', load);
    load();
  });

  (curated.actions ?? []).forEach((action, index) => {
    const card = document.querySelector(`[data-action="${index}"]`);
    if (card === null) return;
    const out = card.querySelector('.out');
    card.querySelector('form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const input = collectInput(card);
      out.innerHTML = '<p class="empty">执行中…</p>';
      const result = await call(action.target, input);
      paintResult(out, result);
      syncKnownIds();
      if (result.ok) await afterMutation(action.target, result);
    });
    card.querySelector('[data-clear]').addEventListener('click', () => {
      card.querySelectorAll('input[type=text], input[type=number], textarea').forEach(el => { el.value = ''; });
      out.innerHTML = '';
    });
  });

  bindMethodBrowser(id);
}

/** Build a form for whatever method is selected, from its server-side spec. */
function bindMethodBrowser(id) {
  const registry = moduleOf(id);
  const select = document.getElementById('method-select');
  const summary = document.getElementById('method-summary');
  const fieldsHost = document.getElementById('method-fields');
  const form = document.getElementById('method-form');
  const out = document.getElementById('method-out');
  if (select === null || registry === undefined) return;

  const paint = () => {
    const name = select.value;
    const spec = (registry.methodSpecs ?? []).find(candidate => candidate.name === name);
    summary.textContent = spec?.summary ?? '';
    const hints = spec?.input ?? {};
    const fields = Object.entries(hints).map(([fieldName, hint]) => ({
      name: fieldName,
      label: fieldName,
      hint: typeof hint === 'string' ? hint : '',
      type: fieldType(fieldName, hint),
    }));
    fieldsHost.innerHTML = fields.length === 0
      ? '<p class="empty">该方法无需参数</p>'
      : fields.map(field => renderField(field, 'm')).join('');
  };

  select.addEventListener('change', paint);
  paint();

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const target = `${id}.${select.value}`;
    const input = collectInput(fieldsHost);
    out.innerHTML = '<p class="empty">执行中…</p>';
    const result = await call(target, input);
    paintResult(out, result);
    syncKnownIds();
    if (result.ok) await afterMutation(target, result);
  });
  document.getElementById('method-run')?.addEventListener('click', () => {
    form.dispatchEvent(new Event('submit', { cancelable: true }));
  });
}

/** Refresh the bits of chrome that a mutation invalidates. */
async function afterMutation(target, result) {
  if (target.startsWith('project-group.')) {
    await loadProjects();
    return;
  }
  if (target.startsWith('wlan-connection.')) {
    const status = await call('wlan-connection.status');
    if (status.ok) paintConnection(status.value);
  }
}

function bindOverview() {
  document.getElementById('ov-refresh')?.addEventListener('click', () => bootstrap());
  document.getElementById('ov-events')?.addEventListener('click', async () => {
    const result = await api('/api/events/recent');
    if (result.events) { state.events = result.events; render(); }
  });
  document.querySelectorAll('[data-goto]').forEach((button) => {
    button.addEventListener('click', () => { state.panel = button.dataset.goto; render(); });
  });
}

function paintConnection(status) {
  if (!status || typeof status !== 'object') return;
  const dot = document.getElementById('conn-dot');
  const text = document.getElementById('conn-text');
  const map = { connected: 'on', connecting: 'warn', disconnected: 'off', error: 'off' };
  dot.className = `status-dot ${map[status.state] ?? 'off'}`;
  text.textContent = `${status.state ?? 'unknown'} · ${status.mode ?? ''} · ${status.message ?? ''}`.replace(/\s+·\s*$/, '');
}

/* ---------------- boot ---------------- */

async function loadProjects() {
  const result = await call('project-group.list');
  const rows = Array.isArray(result.value)
    ? result.value
    : (result.value?.groups ?? result.value?.projects ?? []);
  state.projects = Array.isArray(rows) ? rows : [];
  const select = document.getElementById('project-select');
  const current = state.currentProject;
  select.innerHTML = state.projects.map(row =>
    `<option value="${escapeHtml(row.id)}" ${row.id === current ? 'selected' : ''}>${escapeHtml(row.name)}</option>`).join('')
    || '<option value="default">default</option>';
}

/**
 * Cross-check every hand-written CURATED target against the live registry.
 *
 * The method browser builds its list from the registry so it can never go
 * stale, but the curated cards are literal strings — a rename on the server
 * would silently turn into an HTTP 400. Surfacing the mismatch in the console
 * (and as a badge) keeps that class of bug visible instead of invisible.
 */
function auditCuratedTargets() {
  const known = new Set();
  for (const module of state.modules) {
    for (const spec of module.methodSpecs ?? []) known.add(`${module.id}.${spec.name}`);
  }
  const missing = new Set();
  const visit = (items) => {
    for (const item of items ?? []) {
      if (typeof item?.target === 'string' && !known.has(item.target)) missing.add(item.target);
      visit(item.views);
      visit(item.actions);
    }
  };
  for (const entry of Object.values(CURATED)) visit([entry]);
  if (missing.size > 0) {
    console.warn('[opengui-plus] 前端卡片引用了不存在的方法：', [...missing].join(', '));
  }
  return [...missing];
}

async function bootstrap() {
  const status = await api('/api/status');
  if (status.modules) state.modules = status.modules;
  if (status.activeProjectId) state.currentProject = status.activeProjectId;
  if (status.recentEvents) state.events = status.recentEvents;
  state.brokenTargets = auditCuratedTargets();
  await loadProjects();
  const connection = await call('wlan-connection.status');
  if (connection.ok) paintConnection(connection.value);
  render();
}

document.getElementById('project-select').addEventListener('change', async (event) => {
  const id = event.target.value;
  const result = await call('project-group.switch', { id });
  if (result.ok) {
    state.currentProject = id;
    toast(`已切换到项目组 ${id}`);
    await bootstrap();
  }
});

document.getElementById('btn-new-project').addEventListener('click', async () => {
  const name = window.prompt('新项目组名称');
  if (!name) return;
  const result = await call('project-group.create', { name });
  if (result.ok) {
    toast('项目组已创建');
    await bootstrap();
  }
});

// Live events
const source = new EventSource('/api/events');
source.addEventListener('hello', () => { document.getElementById('sse-dot').className = 'status-dot on'; });
source.addEventListener('plus', (event) => {
  document.getElementById('sse-dot').className = 'status-dot on';
  try {
    const parsed = JSON.parse(event.data);
    if (parsed && typeof parsed === 'object') {
      state.events.push({ source: 'live', type: parsed.type, at: parsed.at });
      if (state.events.length > 200) state.events.shift();
      if (parsed.type === 'connection.state-changed') paintConnection(parsed.payload);
      if (state.panel === 'overview') render();
    }
  } catch { /* ignore malformed frames */ }
});
source.onerror = () => { document.getElementById('sse-dot').className = 'status-dot off'; };

bootstrap();
</script>
</body>
</html>
