<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenGUI-Plus · 设备工作台</title>
<style>
  /* ---------- design tokens (workbuddy-flavored) ---------- */
  :root {
    --bg: #f6f7fb;
    --surface: #ffffff;
    --surface-2: #f1f3fa;
    --ink: #1c1d29;
    --ink-2: #4a4d63;
    --ink-3: #7d8095;
    --line: #e5e7f0;
    --line-2: #d6d9e6;
    --brand: #4f46e5;
    --brand-2: #7c3aed;
    --brand-soft: #eef0ff;
    --accent: #f97316;
    --accent-soft: #fff1e6;
    --ok: #10b981;
    --warn: #f59e0b;
    --err: #ef4444;
    --shadow-1: 0 1px 2px rgba(28,29,41,.04), 0 2px 8px rgba(28,29,41,.04);
    --shadow-2: 0 8px 32px rgba(28,29,41,.10);
    --radius-s: 8px;
    --radius-m: 14px;
    --radius-l: 22px;
    --font: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.55;
    overflow: hidden;
  }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  button { font-family: inherit; font-size: 13px; cursor: pointer; }
  input, select, textarea {
    font-family: inherit; font-size: 13px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius-s); padding: 7px 10px; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
  textarea { resize: vertical; min-height: 60px; }
  label { display: block; font-size: 12.5px; color: var(--ink-2); margin-bottom: 4px; }

  /* ---------- shell ---------- */
  .app { display: grid; grid-template-rows: 56px 1fr; height: 100vh; }
  .topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .topbar .brand { font-weight: 700; font-size: 16px; letter-spacing: .2px; }
  .topbar .brand .dot { color: var(--brand-2); }
  .topbar .crumbs { color: var(--ink-3); font-size: 12.5px; }
  .topbar .spacer { flex: 1; }
  .topbar .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; background: var(--surface-2);
    border-radius: 999px; font-size: 12px; color: var(--ink-2);
  }
  .topbar .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
  .topbar a { color: var(--brand); text-decoration: none; font-size: 12.5px; }
  .topbar a:hover { text-decoration: underline; }
  .topbar select { padding: 4px 8px; font-size: 12.5px; }

  /* ---------- main: dashboard | module panel ---------- */
  .main { position: relative; overflow: hidden; }
  .layout { display: grid; grid-template-columns: 1fr 56px; height: 100%; }
  .center { overflow: auto; padding: 18px 22px; }
  .strip {
    background: var(--surface); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: stretch;
    padding: 6px 0; gap: 2px;
  }
  .strip button {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; padding: 10px 4px; min-height: 56px;
    background: transparent; color: var(--ink-2); border: 0; cursor: pointer;
    border-radius: 0; font-size: 11px; line-height: 1.15; transition: background .15s;
  }
  .strip button:hover { background: var(--surface-2); color: var(--ink); }
  .strip button.active { background: var(--brand-soft); color: var(--brand); }
  .strip button .ico { font-size: 18px; line-height: 1; }
  .strip .sep { height: 1px; background: var(--line); margin: 4px 8px; }

  /* ---------- module dialog: 右侧模块点击后以弹窗打开 ---------- */
  .modal-mask {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(16,18,30,.42); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center;
    padding: 28px 24px; animation: maskIn .16s ease-out;
  }
  .panel {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius-l); box-shadow: var(--shadow-2);
    width: min(980px, 100%); max-height: min(88vh, 900px);
    display: flex; flex-direction: column; overflow: hidden;
    animation: dialogIn .2s cubic-bezier(.2,.85,.3,1.05);
  }
  @keyframes maskIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes dialogIn {
    from { opacity: 0; transform: translateY(12px) scale(.985); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- device grid ---------- */
  .device-grid {
    display: grid; gap: 16px; align-content: start;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  }
  .device-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-l);
    box-shadow: var(--shadow-1); overflow: hidden; display: flex; flex-direction: column;
  }
  .device-card .frame {
    aspect-ratio: 9/19.5; background: #111; position: relative; overflow: hidden;
  }
  .device-card .frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .device-card .frame .ph {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #888; font-size: 12.5px; flex-direction: column; gap: 6px;
  }
  .device-card .frame .ph .ring {
    width: 24px; height: 24px; border: 2px solid #444; border-top-color: #aaa;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .device-card .body { padding: 10px 12px; display: flex; align-items: center; gap: 8px; }
  .device-card .body .name { font-weight: 600; }
  .device-card .body .serial { color: var(--ink-3); font-size: 12px; flex: 1; }
  .device-card .body .status { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .device-card .body .status.off { background: var(--ink-3); }
  .device-card .body .status.err { background: var(--err); }
  .device-card .actions { display: flex; gap: 6px; padding: 0 12px 12px; flex-wrap: wrap; }
  .device-card .actions button {
    background: var(--surface-2); color: var(--ink-2); border: 0;
    border-radius: 999px; padding: 5px 10px; font-size: 12px;
  }
  .device-card .actions button:hover { background: var(--brand-soft); color: var(--brand); }

  /* ---------- generic cards / forms ---------- */
  .empty {
    border: 1.5px dashed var(--line-2); border-radius: var(--radius-l);
    padding: 40px 20px; text-align: center; color: var(--ink-3); background: var(--surface);
  }
  .empty .big { font-size: 16px; color: var(--ink-2); margin-bottom: 6px; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-l);
    box-shadow: var(--shadow-1); padding: 18px 20px; margin-bottom: 16px;
  }
  .card h3 { margin: 0 0 4px; font-size: 15px; }
  .card .sub { color: var(--ink-3); font-size: 12.5px; margin-bottom: 14px; }
  .card .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
  .card .field { display: flex; flex-direction: column; gap: 4px; min-width: 140px; }
  .card .field.grow { flex: 1; }
  .card button.primary {
    background: var(--brand); color: #fff; border: 0; padding: 8px 14px;
    border-radius: var(--radius-s); font-weight: 500;
  }
  .card button.primary:hover { background: #4338ca; }
  .card button.ghost {
    background: var(--surface-2); color: var(--ink-2); border: 0; padding: 7px 12px;
    border-radius: var(--radius-s);
  }
  .card button.ghost:hover { background: var(--line); }
  .card button.danger {
    background: transparent; color: var(--err); border: 1px solid #fecaca;
    padding: 7px 12px; border-radius: var(--radius-s);
  }
  .card button.danger:hover { background: #fef2f2; }
  .card .table { width: 100%; border-collapse: collapse; }
  .card .table th, .card .table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .card .table th { color: var(--ink-3); font-weight: 500; font-size: 12px; }
  .card .table tr:hover td { background: var(--surface-2); }
  .card .table .tag { display: inline-block; background: var(--brand-soft); color: var(--brand); padding: 2px 8px; border-radius: 999px; font-size: 11.5px; margin-right: 4px; }
  .card .table .ok { color: var(--ok); font-weight: 500; }
  .card .table .err { color: var(--err); }
  .card .table .off { color: var(--ink-3); }

  .switch { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 2px; }
  .switch button { background: transparent; color: var(--ink-2); border: 0; padding: 5px 12px; border-radius: 999px; font-size: 12.5px; }
  .switch button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px;
    font-size: 13px; box-shadow: var(--shadow-2); opacity: 0; transition: opacity .25s;
    pointer-events: none; z-index: 1000; max-width: 80vw;
  }
  .toast.show { opacity: 0.95; }
  .toast.err { background: var(--err); }
  .toast.ok { background: var(--ok); }

  /* ---------- module panel header ---------- */
  .panel header {
    padding: 18px 22px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px; flex: 0 0 auto;
  }
  .panel header .ico { font-size: 22px; }
  .panel header h2 { margin: 0; font-size: 16px; }
  .panel header .sub { color: var(--ink-3); font-size: 12.5px; }
  .panel header .x {
    margin-left: auto; width: 28px; height: 28px; border-radius: 50%;
    background: var(--surface-2); border: 0; color: var(--ink-2); font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .panel header .x:hover { background: var(--line); }
  .panel .body { padding: 18px 22px; overflow: auto; flex: 1 1 auto; }

  /* ---------- device management specific ---------- */
  .dev-list { display: flex; flex-direction: column; gap: 10px; }
  .dev-row {
    border: 1px solid var(--line); border-radius: var(--radius-m); padding: 12px 14px;
    background: var(--surface); display: grid; grid-template-columns: 1fr auto; gap: 8px;
  }
  .dev-row .title { display: flex; align-items: center; gap: 8px; font-weight: 500; }
  .dev-row .meta { color: var(--ink-3); font-size: 12px; margin-top: 2px; }
  .dev-row .pills { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .dev-row .pills .tag { background: var(--brand-soft); color: var(--brand); padding: 2px 8px; border-radius: 999px; font-size: 11.5px; }
  .dev-row .pills .tag.muted { background: var(--surface-2); color: var(--ink-2); }
  .dev-row .pills .tag.warn { background: #fff7ed; color: #c2410c; }
  .dev-row .actions { display: flex; gap: 6px; align-items: start; }
  .dev-row .actions button {
    background: var(--surface-2); color: var(--ink-2); border: 0;
    border-radius: var(--radius-s); padding: 6px 10px; font-size: 12px;
  }
  .dev-row .actions button:hover { background: var(--brand-soft); color: var(--brand); }
  .dev-row .actions button.danger { color: var(--err); }
  .dev-row .actions button.danger:hover { background: #fef2f2; }
  .kv-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
  .kv-grid > div { background: var(--surface-2); border-radius: var(--radius-m); padding: 10px 12px; }
  .kv-grid > div > span { display: block; font-size: 11.5px; color: var(--ink-3); margin-bottom: 4px; }
  .kv-grid > div > b { font-size: 14px; font-weight: 600; }

  .tabs { display: flex; gap: 4px; margin-bottom: 14px; flex-wrap: wrap; }
  .tabs button {
    background: transparent; color: var(--ink-2); border: 0;
    padding: 7px 12px; border-radius: var(--radius-s); font-size: 13px;
  }
  .tabs button.on { background: var(--brand-soft); color: var(--brand); }

  .qrbox {
    display: flex; align-items: center; gap: 18px; padding: 14px;
    background: var(--surface-2); border-radius: var(--radius-m);
  }
  .qrbox img { width: 160px; height: 160px; background: #fff; border-radius: var(--radius-s); }
  .qrbox .info { font-size: 12.5px; color: var(--ink-2); }
  .qrbox .info .h { font-size: 14px; font-weight: 500; color: var(--ink); margin-bottom: 4px; }

  /* ---------- responsive ---------- */
  @media (max-width: 960px) {
    .layout { grid-template-columns: 1fr 52px; }
    .modal-mask { padding: 12px; }
    .panel { max-height: 94vh; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">Open<span class="dot">·</span>GUI <span style="color:var(--ink-3);font-weight:500">工作台</span></div>
    <span class="crumbs" id="crumbs">设备</span>
    <div class="spacer"></div>
    <span class="pill"><span class="dot"></span><span id="conn-state">已连接</span></span>
    <select id="project-select" title="当前项目组"></select>
    <a href="/index.html" target="_blank" rel="noopener">开发者控制台 ↗</a>
  </header>
  <div class="main">
    <div class="layout" id="layout">
      <section class="center" id="center"></section>
      <aside class="strip" id="strip"></aside>
    </div>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast" class="toast"></div>

<script>
/* ========================================================================
 *  Module catalogue
 *  Each entry is a friendly face for one of the 10 backend modules.
 *  Modules expose: { id, name, ico, hint, render(state), bind(state) }.
 *  The `render` callback returns the inner HTML for the module panel. No
 *  method names, no raw JSON — the user only sees labelled buttons and forms.
 * ====================================================================== */

const STRIP = [
  { id: 'wlan-connection',    name: '设备',     ico: '📱', hint: '连接手机、扫码配对、统一管理设备' },
  { id: 'snippet-library',    name: '指令',     ico: '⚡', hint: '把常用 adb 命令收藏成可复用的指令' },
  { id: 'action-template',    name: '模板',     ico: '🎬', hint: '录制操作流程，一键回放' },
  { id: 'scheduler',          name: '定时',     ico: '⏰', hint: '按计划自动执行指令或模板' },
  { id: 'project-group',      name: '项目',     ico: '🗂', hint: '按项目隔离数据，切换即重置' },
  { id: 'demo-recorder',      name: '演示',     ico: '📼', hint: '录一段带截图的演示给 AI 看' },
  { id: 'workflow-marketplace', name: '市场',  ico: '🛍', hint: '下载社区模板，发布自己的模板' },
  { id: 'feedback-rl',        name: '反馈',     ico: '🧠', hint: '让 AI 记住每次失败和解决办法' },
  { id: 'device-pool',        name: '设备池',   ico: '🖧', hint: '多机协同与任务队列' },
  { id: 'replay',             name: '回放',     ico: '🎞', hint: '把执行过程录成可分享的影片' },
];

/* ====================================================================== */
/* API helpers                                                             */
/* ====================================================================== */

function isResultEnvelope(value) {
  if (value === null || typeof value !== 'object' || Array.isArray(value)) return false;
  if (typeof value.ok !== 'boolean') return false;
  return value.ok === false ? typeof value.error === 'string' : 'value' in value;
}

async function call(target, input = {}) {
  let response;
  try { response = await fetch('/api/call', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ target, input }) }); }
  catch (error) { return { ok: false, error: '网络错误：' + (error?.message ?? String(error)) }; }
  let json;
  try { json = await response.json(); }
  catch { return { ok: false, error: `http ${response.status}: 非 JSON 响应` }; }
  if (!json.ok) return { ok: false, error: json.error ?? `http ${response.status}` };
  const inner = isResultEnvelope(json.value) ? json.value : null;
  const payload = inner ?? json;
  if (payload.ok === true) return { ok: true, value: payload.value };
  if (payload.ok === false) return { ok: false, error: payload.error ?? '未给出原因' };
  return { ok: true, value: payload };
}

async function getStatus() {
  try { const r = await fetch('/api/status'); return await r.json(); }
  catch { return { activeProjectId: 'default', modules: [] }; }
}

/* ====================================================================== */
/* Toast                                                                   */
/* ====================================================================== */
const toastEl = document.getElementById('toast');
let toastTimer = null;
function toast(msg, kind = '', durationMs = 2400) {
  toastEl.textContent = msg;
  toastEl.className = 'toast show' + (kind ? ' ' + kind : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.className = 'toast', durationMs);
}

/* ====================================================================== */
/* State                                                                   */
/* ====================================================================== */
const state = {
  view: 'dashboard',          // 'dashboard' | moduleId
  status: null,
  projects: [],
  currentProject: null,
  panel: null,                // module descriptor
  devices: [],                // discovered live devices (from adb devices -l)
  pairable: [],               // mDNS wireless-debug devices waiting to pair/connect
  mdnsError: undefined,       // last mDNS probe error (Bonjour missing, etc.)
  screenshots: new Map(),     // serial -> { url, ts }
  refreshTimer: null,         // screencap polling
  deviceTimer: null,          // periodic discover() polling for live refresh
  focusSerial: null,
  tplRecording: null,
};

/* ====================================================================== */
/* Render: topbar, strip, dashboard, panel                                */
/* ====================================================================== */

function renderStrip() {
  const strip = document.getElementById('strip');
  strip.innerHTML = STRIP.map(m => `
    <button data-strip="${m.id}" class="${state.view === m.id ? 'active' : ''}" title="${m.name} · ${m.hint}">
      <span class="ico">${m.ico}</span>
      <span>${m.name}</span>
    </button>
  `).join('');
  strip.querySelectorAll('[data-strip]').forEach(btn => {
    // 再点一次同一个模块 = 关闭弹窗
    btn.addEventListener('click', () => {
      if (state.view === btn.dataset.strip) closeModule();
      else openModule(btn.dataset.strip);
    });
  });
}

function renderProjectSelect() {
  const sel = document.getElementById('project-select');
  const opts = (state.projects.length ? state.projects : [{ id: 'default', name: 'default' }])
    .map(p => `<option value="${escapeHtml(p.id)}" ${p.id === state.currentProject ? 'selected' : ''}>${escapeHtml(p.name)} · ${escapeHtml(p.id)}</option>`)
    .join('');
  sel.innerHTML = opts;
}

// 左侧永远是设备投屏网格：模块改成弹窗后，网格不再被面板挤走，
// 弹窗打开时它依然在背后实时刷新。重新渲染时保留滚动位置，避免轮询把页面跳回顶部。
function renderCenter() {
  const c = document.getElementById('center');
  const top = c.scrollTop;
  c.innerHTML = renderDashboard();
  c.scrollTop = top;
  bindDashboardEvents();
}

function renderPanel() {
  const root = document.getElementById('modal-root');
  const mod = state.view !== 'dashboard' ? STRIP.find(m => m.id === state.view) : null;
  if (!mod) { root.innerHTML = ''; document.body.style.overflow = ''; return; }
  document.body.style.overflow = 'hidden';
  document.getElementById('crumbs').textContent = mod.name;
  root.innerHTML = `
    <div class="modal-mask" id="modal-mask">
      <div class="panel" role="dialog" aria-modal="true" aria-label="${escapeHtml(mod.name)}">
        <header>
          <span class="ico">${mod.ico}</span>
          <div>
            <h2>${mod.name}</h2>
            <div class="sub">${mod.hint}</div>
          </div>
          <button class="x" id="panel-close" title="关闭（Esc）">×</button>
        </header>
        <div class="body" id="panel-body">${modules[mod.id].render(state) ?? ''}</div>
      </div>
    </div>
  `;
  document.getElementById('panel-close').addEventListener('click', closeModule);
  // 点遮罩空白处关闭；点在弹窗内部不关。用 mousedown 而不是 click，
  // 否则从弹窗内拖选文本松手时会误判成点遮罩。
  document.getElementById('modal-mask').addEventListener('mousedown', (event) => {
    if (event.target.id === 'modal-mask') closeModule();
  });
  modules[mod.id].bind?.(state);
}

/* ====================================================================== */
/* Dashboard view                                                          */
/* ====================================================================== */

function renderDashboard() {
  const cards = state.devices.map(d => renderDeviceCard(d)).join('');
  const pairable = (state.pairable ?? []).map(p => renderPairableCard(p)).join('');
  const mdnsHint = state.mdnsError
    ? `<div class="empty" style="margin-top:10px">无线调试探测失败：${escapeHtml(state.mdnsError)}<br>通常是电脑没装 Bonjour（Windows）或 adb mDNS 被防火墙拦截，可改用「设备」面板里的「手动 WiFi」或「扫二维码」。</div>`
    : '';
  return `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
      <h2 style="margin:0;font-size:18px">已连接的设备</h2>
      <span class="pill" style="background:var(--brand-soft);color:var(--brand)">
        ${state.devices.length} 台在线
      </span>
      <div style="flex:1"></div>
      <button class="ghost" id="dash-refresh" style="background:var(--surface-2);border:0;border-radius:8px;padding:6px 12px;color:var(--ink-2)">↻ 重新检测</button>
    </div>
    ${cards
      ? `<div class="device-grid">${cards}</div>`
      : `<div class="empty">
           <div class="big">还没有在线的设备</div>
           <div>把手机用 USB 连上电脑（记得点「允许 USB 调试」），或点右侧「设备」模块用配对码 / 扫码连接。</div>
         </div>`}
    ${pairable
      ? `<div style="margin-top:24px">

function bindDashboardEvents() {
  document.getElementById('dash-refresh')?.addEventListener('click', refreshDevices);
  document.querySelectorAll('[data-act]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const act = btn.dataset.act;
      const serial = btn.dataset.serial;
      if (act === 'add') return addDeviceFromDiscover(serial, btn.dataset.name);
      if (act === 'screencap') return takeScreenshot(serial);
      if (act === 'open') return openModule('wlan-connection', serial);
    });
  });
  document.querySelectorAll('[data-pair]').forEach(btn => {
    btn.addEventListener('click', async () => {
      let p; try { p = JSON.parse(btn.dataset.pair); } catch { return; }
      await pairDiscoveredDevice(p);
    });
  });
}

/* ====================================================================== */
/* Device grid: discovery + screencap polling                             */
/* ====================================================================== */

async function refreshDevices({ silent = false } = {}) {
  const result = await call('wlan-connection.discover');
  if (!result.ok) { if (!silent) toast(result.error, 'err'); return; }
  state.devices = (result.value?.devices ?? []).map(d => ({ ...d }));
  state.pairable = (result.value?.pairable ?? []).map(p => ({ ...p }));
  state.mdnsError = result.value?.mdnsError ?? undefined;
  const live = new Set(state.devices.map(d => d.serial));
  for (const key of [...state.screenshots.keys()]) if (!live.has(key)) state.screenshots.delete(key);
  renderCenter();
}

async function takeScreenshot(serial) {
  const r = await call('wlan-connection.screencap', { serial });
  if (!r.ok) { toast('截图失败：' + r.error, 'err'); return; }
  const url = `/files/${encodeURI(r.value.path)}?ts=${Date.now()}`;
  state.screenshots.set(serial, { url, ts: r.value.takenAt });
  renderCenter();
}

function startScreenshotPolling() {
  if (state.refreshTimer) return;
  const tick = async () => {
    for (const d of state.devices) {
      if (d.state !== 'device') continue;
      const r = await call('wlan-connection.screencap', { serial: d.serial });
      if (r.ok) state.screenshots.set(d.serial, { url: `/files/${encodeURI(r.value.path)}?ts=${Date.now()}`, ts: r.value.takenAt });
    }
    renderCenter();
  };
  state.refreshTimer = setInterval(tick, 2500);
}

// Poll discover() so a freshly plugged-in USB phone (or a phone that just
// opened wireless debugging) shows up in the device grid without a manual
// refresh. The grid is always mounted now (modules open as dialogs), so the
// re-render happens no matter which module is currently open.
function startDevicePolling() {
  if (state.deviceTimer) return;
  const tick = async () => {
    await refreshDevices({ silent: true });
  if (state.view === 'wlan-connection') refreshConnStatus();
};  state.deviceTimer = setInterval(tick, 4000);
}

/* ====================================================================== */
/* Module open/close                                                        */
/* ====================================================================== */

function openModule(id, focusSerial) {
  state.view = id;
  state.focusSerial = focusSerial;
  renderStrip();
  renderPanel();
}
function closeModule() {
  state.view = 'dashboard';
  state.focusSerial = null;
  renderStrip();
  renderCenter();
  renderPanel();
  document.getElementById('crumbs').textContent = '设备';
}

/* ====================================================================== */
/* Common helpers                                                           */
/* ====================================================================== */
function escapeHtml(value) {
  if (value === null || value === undefined) return '';
  return String(value).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

function renderField(field, key) {
  const id = `f-${key}-${field.name}`;
  const placeholder = field.placeholder ? ` placeholder="${escapeHtml(field.placeholder)}"` : '';
  const required = field.required ? ' required' : '';
  const type = field.type ?? 'text';
  let input = '';
  if (type === 'textarea') {
    input = `<textarea id="${id}" name="${escapeHtml(field.name)}"${placeholder}${required}>${escapeHtml(field.value ?? '')}</textarea>`;
  } else if (type === 'select') {
    input = `<select id="${id}" name="${escapeHtml(field.name)}">${(field.options ?? []).map(opt => `<option value="${escapeHtml(opt)}" ${String(opt) === String(field.value ?? '') ? 'selected' : ''}>${escapeHtml(opt)}</option>`).join('')}</select>`;
  } else if (type === 'checkbox') {
    input = `<label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="${id}" name="${escapeHtml(field.name)}" ${field.value === true ? 'checked' : ''}> 启用</label>`;
  } else if (type === 'number') {
    input = `<input type="number" id="${id}" name="${escapeHtml(field.name)}" value="${escapeHtml(field.value ?? '')}"${placeholder}${required}>`;
  } else {
    input = `<input type="text" id="${id}" name="${escapeHtml(field.name)}" value="${escapeHtml(field.value ?? '')}"${placeholder}${required}>`;
  }
  const req = field.required ? ' <span style="color:var(--err)">*</span>' : '';
  return `<div class="field ${field.grow ? 'grow' : ''}">
    <label for="${id}">${escapeHtml(field.label ?? field.name)}${req}</label>${input}
    ${field.hint && !field.label ? `<div style="color:var(--ink-3);font-size:11.5px">${escapeHtml(field.hint)}</div>` : ''}
  </div>`;
}

function readForm(form) {
  const data = {};
  for (const el of form.querySelectorAll('input,select,textarea')) {
    if (!el.name) continue;
    if (el.type === 'checkbox') data[el.name] = el.checked;
    else if (el.type === 'number') data[el.name] = el.value === '' ? undefined : Number(el.value);
    else data[el.name] = el.value;
  }
  return data;
}

function refresh() {
  renderCenter();
  if (state.view !== 'dashboard') renderPanel();
}

function wlanListTab(s) {
  return `<div class="card">
    <h3>已管理设备 <span style="color:var(--ink-3);font-weight:400">· 共 ${s.devices.length} 台</span></h3>
    <div class="sub">点击编辑备注、调整分组、绑定任务标识。设备池模块会按分组调度任务。</div>
    <div class="dev-list" id="dev-list"></div>
  </div>`;
}

function bindWlanTab(name, s) {
  if (name === 'list') bindDevList(s);
  else if (name === 'add') bindAddTab(s);
  else if (name === 'pair') bindPairTab(s);
  else bindConnTab(s);
}

function bindDevList(s) {
  const list = document.getElementById('dev-list');
  if (s.devices.length === 0) {
    list.innerHTML = `<div class="empty"><div class="big">还没有管理任何设备</div><div>在「添加设备」里手动加入，或使用「自动检测」一键导入。</div></div>`;
    return;
  }
  call('device-pool.listGroups').then(r => {
    const groupNames = (r.ok ? (r.value?.groups ?? []).map(g => g.name) : []);
    list.innerHTML = s.devices.map(d => devRow(d, groupNames)).join('');
    list.querySelectorAll('[data-dev-act]').forEach(btn => {
      btn.addEventListener('click', () => handleDevAction(btn.dataset.devAct, btn.dataset.serial));
    });
    list.querySelectorAll('form[data-dev-edit]').forEach(form => {
      form.addEventListener('submit', e => { e.preventDefault(); saveDeviceEdit(form, s); });
    });

}

function devRow(d, groupNames) {
  const groups = (d.groups ?? []).map(g => `<span class="tag">${escapeHtml(g)}</span>`).join('');
  const meta = [];
  if (d.taskId) meta.push(`任务：<b>${escapeHtml(d.taskId)}</b>`);
  if (d.notes) meta.push(`备注：${escapeHtml(d.notes)}`);
  if (d.model) meta.push(`型号：${escapeHtml(d.model)}`);
  return `<div class="dev-row" data-serial="${escapeHtml(d.serial)}">
    <div>
      <div class="title">
        <span>${d.state === 'device' ? '🟢' : '⚪'}</span>
        <span>${escapeHtml(d.name ?? d.serial)}</span>
        <span class="mono" style="color:var(--ink-3);font-size:12px;font-weight:400">${escapeHtml(d.serial)}</span>
        <span class="tag muted" style="background:var(--surface-2);color:var(--ink-2)">${d.transport === 'usb' ? 'USB' : 'WiFi'}</span>
        ${d.known ? '' : '<span class="tag warn">新设备</span>'}
      </div>
      <div class="meta">${meta.join(' · ') || '未设置备注 / 任务 / 分组'}</div>
      <div class="pills">${groups || '<span class="tag muted" style="background:transparent;color:var(--ink-3)">未分组</span>'}</div>
      <form data-dev-edit="${escapeHtml(d.serial)}" style="margin-top:10px;display:grid;grid-template-columns:1fr 2fr 1fr auto;gap:6px;align-items:end">
        <div><label>设备名</label><input name="name" value="${escapeHtml(d.name ?? '')}" placeholder="如 测试机-Pixel7"></div>
        <div><label>设备分组（逗号分隔）</label><input name="groups" value="${escapeHtml((d.groups ?? []).join(', '))}" placeholder="如 qa, pixel, 主力" list="known-groups"></div>
        <div><label>绑定任务标识</label><input name="taskId" value="${escapeHtml(d.taskId ?? '')}" placeholder="如 smoke-android"></div>
        <div style="display:flex;gap:6px">
          <button class="primary" type="submit">保存</button>
          <button class="danger" data-dev-act="delete" data-serial="${escapeHtml(d.serial)}" type="button">删除</button>
        </div>
        <datalist id="known-groups">${groupNames.map(g => `<option value="${escapeHtml(g)}">`).join('')}</datalist>
        <div style="grid-column:1 / -1"><label>备注</label><input name="notes" value="${escapeHtml(d.notes ?? '')}" placeholder="如 8 月新到货，分配给 QA-A 同学"></div>
      </form>
    </div>
  </div>`;
}

async function saveDeviceEdit(form, s) {
  const serial = form.dataset.devEdit;
  const device = s.devices.find(x => x.serial === serial);
  if (!device) return toast('找不到这台设备', 'err');
  const data = readForm(form);
  const groups = (data.groups ?? '').split(/[,，;；\s]+/).map(t => t.trim()).filter(Boolean);
  const r = await call('wlan-connection.saveDevice', {
    id: device.id, transport: device.transport,
    name: data.name || device.name,
    groups, taskId: data.taskId || undefined, notes: data.notes || undefined,
    ...(device.transport === 'usb' ? { serial } : { wifi: device.wifi, host: device.wifi?.host, port: device.wifi?.port }),
  });
  if (!r.ok) return toast('保存失败：' + r.error, 'err');
  toast('已保存', 'ok');
  await refreshDevices();
  modules['wlan-connection'].bind(s);
}

async function handleDevAction(act, serial) {
  if (act === 'delete') {
    if (!confirm(`确定删除设备 ${serial}？`)) return;
    const r = await call('wlan-connection.removeDevice', { id: (state.devices.find(d => d.serial === serial) ?? {}).id });
    if (!r.ok) return toast('删除失败：' + r.error, 'err');
    toast('已删除', 'ok');
    await refreshDevices();
    modules['wlan-connection'].bind(state);
  }
}

function wlanAddTab(s) {
  return `<div class="card">
    <h3>添加设备</h3>
    <div class="sub">选一种最适合当前场景的方式，添加后会出现在「已管理设备」里。</div>
    <div class="tabs">
      <button data-add="auto" class="on">🔍 自动检测</button>
      <button data-add="usb">🔌 手动 USB</button>
      <button data-add="wifi">📡 手动 WiFi</button>
      <button data-add="qr">📷 扫二维码</button>
    </div>
    <div id="add-pane"></div>
  </div>`;
}

function bindAddTab(s) {
  const renderPane = (kind) => {
    document.querySelectorAll('#panel [data-add]').forEach(b => b.classList.toggle('on', b.dataset.add === kind));
    const pane = document.getElementById('add-pane');
    if (kind === 'auto') pane.innerHTML = addAutoPane();
    else if (kind === 'usb') pane.innerHTML = addUsbPane();
    else if (kind === 'wifi') pane.innerHTML = addWifiPane();
    else pane.innerHTML = addQrPane();

    // Wire form submissions — the previous code only preventDefault-ed them,
    // so every add-device form (add-usb / add-wifi / add-qr) was a dead end.
    pane.querySelectorAll('form').forEach(form => {
      form.addEventListener('submit', e => {
        e.preventDefault();
        const data = readForm(form);
        if (form.id === 'add-usb') submitUsbForm(data);
        else if (form.id === 'add-wifi') submitWifiForm(data);
        else if (form.id === 'add-qr') submitQrForm(data);
      });
    });

    // Action buttons (generate reverse QR, auto-detect) — delegated click.
    pane.addEventListener('click', e => {
      const btn = e.target.closest('[data-act],[data-add-act]');
      if (!btn) return;
      if (btn.dataset.act === 'gen') generateReverseQr();
      else if (btn.dataset.addAct) handleAddAction(btn.dataset.addAct, pane);
    });
  };
  document.querySelectorAll('#panel [data-add]').forEach(b => b.addEventListener('click', () => renderPane(b.dataset.add)));
  renderPane('auto');
}

function parseGroupList(raw) {
  return String(raw ?? '').split(/[,，;；\s]+/).map(t => t.trim()).filter(Boolean);
}

async function submitUsbForm(data) {
  if (!data.serial) return toast('请填写 USB 序列号', 'err');
  const r = await call('wlan-connection.saveDevice', {
    transport: 'usb', serial: data.serial, name: data.name, model: data.model,
    groups: parseGroupList(data.groups), taskId: data.taskId, notes: data.notes,
  });
  if (!r.ok) return toast('保存失败：' + r.error, 'err');
  toast('已加入管理', 'ok');
  await refreshDevices();
}

async function submitWifiForm(data) {
  if (!data.host) return toast('请填写 WiFi 地址', 'err');
  const port = data.port ? Number(data.port) : 5555;
  const input = {
    transport: 'wifi', host: data.host, port, name: data.name,
    groups: parseGroupList(data.groups), taskId: data.taskId, notes: data.notes,
  };
  if (data.pairingPort) input.pairingPort = Number(data.pairingPort);
  const r = await call('wlan-connection.saveDevice', input);
  if (!r.ok) return toast('保存失败：' + r.error, 'err');
  toast('已加入管理', 'ok');
  await refreshDevices();
}

async function submitQrForm(data) {
  if (!data.qr) return toast('请粘贴二维码内容', 'err');
  const input = { qr: data.qr };
  if (data.name) input.name = data.name;
  // pairAndConnect parses the QR → calls `adb pair <host>:<pairingPort> <code>`
  // via mDNS-resolved service name, then `adb connect` on the real connect
  // port, and saves the profile — so one click does the whole flow.
  const r = await call('wlan-connection.pairAndConnect', input);
  if (!r.ok) return toast('配对失败：' + r.error, 'err');
  const v = r.value ?? {};
  toast(v.connected ? '已配对并连接' : '配对完成（连接未建立）', 'ok');
  await refreshDevices();
}

async function generateReverseQr() {
  const out = document.getElementById('qr-out');
  if (!out) return;
  out.innerHTML = `<div class="empty">正在生成二维码…</div>`;
  const serviceName = 'opengui-plus-' + Math.random().toString(36).slice(2, 8);
  // generate=true + waitForScan=true tells pairWithQr to mint a QR via
  // startQrPairing and return immediately so we can show it. Pairing itself
  // happens in the background once the phone scans.
  const r = await call('wlan-connection.pairWithQr', { serviceName, generate: true, waitForScan: false });
  if (!r.ok) { out.innerHTML = `<div class="empty">${escapeHtml(r.error)}</div>`; return; }
  const v = r.value ?? {};
  if (v.qr?.dataUrl || v.dataUrl) {
    const dataUrl = v.qr?.dataUrl ?? v.dataUrl;
    const qrText = v.qr?.qrText ?? v.qrText ?? '';
    out.innerHTML = `<img src="${escapeHtml(dataUrl)}" style="width:100%;max-width:260px;background:white;padding:8px;border-radius:8px">
      <div style="color:var(--ink-3);font-size:11.5px;margin-top:6px">服务名：<code>${escapeHtml(serviceName)}</code></div>
      <div style="color:var(--ink-3);font-size:11.5px;margin-top:4px">二维码文本：<br><code style="word-break:break-all">${escapeHtml(qrText)}</code></div>
      <div class="sub" style="margin-top:8px">请在手机「开发者选项 → 无线调试」里点「用二维码配对」扫描这张图。</div>`;
    return;
  }
  out.innerHTML = `<div class="empty">二维码生成成功，但后端未返回 dataUrl。<br>${escapeHtml(JSON.stringify(v))}</div>`;
}

function addAutoPane() {
  return `<div class="sub">点击「开始检测」会扫描 adb 报告的所有设备，自动保存尚未入库的新设备。</div>
    <div style="display:flex;gap:10px;margin:10px 0"><button class="primary" data-add-act="auto">开始检测</button></div>
    <div id="auto-result"></div>`;
}

async function handleAddAction(act, pane) {
  if (act === 'auto') {
    const r = await call('wlan-connection.discover');
    const out = document.getElementById('auto-result');
    if (!r.ok) { out.innerHTML = `<div class="empty">检测失败：${escapeHtml(r.error)}</div>`; return; }

    const devices = r.value.devices ?? [];
    const pairable = r.value.pairable ?? [];
    const newOnes = devices.filter(d => !d.known);
    const mdnsError = r.value.mdnsError;

    if (newOnes.length === 0 && pairable.length === 0) {
      let html = `<div class="empty"><div class="big">没有发现新设备</div><div>所有 adb 报告的设备都已经在管理列表里，且没有通过 mDNS 广播的待配对手机。</div></div>`;
      if (mdnsError) html += `<div class="empty" style="margin-top:8px">mDNS 探测不可用：${escapeHtml(mdnsError)}<br>这通常是因为电脑没装 Bonjour（Windows）或 adb mdns 被防火墙拦了。可以改用「手动 WiFi」或「扫二维码」。</div>`;
      out.innerHTML = html;
      return;
    }

    const parts = [];
    if (newOnes.length > 0) {
      parts.push(`<div class="card" style="margin:0 0 10px;box-shadow:none;border:1px dashed var(--line-2)">
        <h3>已连接的 adb 设备 · ${newOnes.length} 台新</h3>
        ${newOnes.map(d => `<div class="dev-row" style="grid-template-columns:1fr auto">
          <div><div class="title">${escapeHtml(d.name ?? d.serial)}</div><div class="meta">${escapeHtml(d.serial)} · ${escapeHtml(d.model ?? '')} · ${escapeHtml(d.transport)}</div></div>
          <div class="actions"><button class="primary" data-import="${escapeHtml(d.serial)}">导入</button></div>
        </div>`).join('')}
      </div>`);
    }
    if (pairable.length > 0) {
      parts.push(`<div class="card" style="margin:0;box-shadow:none;border:1px dashed var(--line-2)">
        <h3>mDNS 发现的无线调试设备 · ${pairable.length} 台待配对</h3>

    });
    out.querySelectorAll('[data-pair]').forEach(btn => {

async function pairDiscoveredDevice(p) {
  if (p.kind === 'pairing') {
    const code = prompt(`手机「无线调试」页面上显示的 6 位配对码：\n\n${p.serviceName}  @  ${p.host}:${p.port}`);
    if (!code) return;
    const r = await call('wlan-connection.pairAndConnect', { host: p.host, port: p.port, code: code.trim() });
    if (!r.ok) return toast('配对失败：' + r.error, 'err');
    const v = r.value ?? {};
    toast(v.connected ? '已配对并连接' : '配对完成（连接未建立）', 'ok');
  } else {
    // connect-kind: device is already paired, just save the profile and connect.
    const save = await call('wlan-connection.saveDevice', {
      transport: 'wifi', host: p.host, port: p.port, name: p.serviceName,
    });
    if (!save.ok) return toast('保存失败：' + save.error, 'err');
    const c = await call('wlan-connection.connect', { mode: 'wifi', id: save.value?.device?.id });
    if (!c.ok) {
      // Most common failure: TCP connect to the advertised port is refused,
      // because Android's wireless-debug listener has dropped (locked screen,
      // toggle flipped, port rotated) but the stale mDNS entry still
      // advertises the old port. Surface a clear, actionable hint instead of
      // the raw "actively refused" error.
      const raw = String(c.error ?? '');
      const isRefused = /拒绝|refus|closed|ECONNREFUSED|cannot connect|unable to connect|actively|not listening/i.test(raw);
      if (isRefused) {
        toast('端口被拒（手机无线调试监听已掉）→ 保持「无线调试」页面前台打开，5 秒后点「↻ 刷新」重扫端口；或改用「使用配对码配对设备」重新配对', 'err', 5200);
      } else {
        toast('连接失败：' + raw, 'err');
      }
      return;
    }
    toast('已连接', 'ok');
  }
  await refreshDevices();
}

async function addDeviceFromDiscover(serial, defaultName) {
  const r = await call('wlan-connection.discover');
  if (!r.ok) return toast('导入失败：' + r.error, 'err');
  const d = (r.value.devices ?? []).find(x => x.serial === serial);
  if (!d) return toast('设备已离线', 'err');
  const save = await call('wlan-connection.saveDevice', {
    transport: d.transport, serial: d.serial, name: defaultName ?? d.serial,
    model: d.model,
  });
  if (!save.ok) return toast('导入失败：' + save.error, 'err');
  toast('已加入管理', 'ok');
  await refreshDevices();
}

// Renders the live connection panel: mode, state, currently visible adb
// devices, and mDNS pairable phones. Safe to call from the periodic device
// poll — it no-ops when the connection tab is not on screen.
async function refreshConnStatus() {
  const out = document.getElementById('conn-out');
  if (!out) return;
  const [st, disc] = await Promise.all([
    call('wlan-connection.status'),
    call('wlan-connection.discover'),
  ]);
  if (!st.ok) {
    out.innerHTML = `<div class="empty" style="color:var(--err)">读取连接状态失败：${escapeHtml(st.error)}</div>`;
    return;
  }
  const s = st.value ?? {};
  const devices = disc.ok ? (disc.value?.devices ?? []) : [];
  const pairable = disc.ok ? (disc.value?.pairable ?? []) : [];
  const adbError = disc.ok ? disc.value?.adbError : undefined;
  const mdnsError = disc.ok ? disc.value?.mdnsError : undefined;
  const mode = s.mode ?? (s.preference && s.preference.mode) ?? 'auto';
  const stateLabelMap = { connected: '已连接', connecting: '连接中', disconnected: '未连接', error: '错误' };
  const stateLabel = stateLabelMap[s.state] ?? s.state ?? '未知';
  const endpoint = s.endpoint ? `${s.endpoint.host}:${s.endpoint.port}` : (s.serial ?? '—');
  const devHtml = devices.length
    ? devices.map(d => `<div class="dev-row">
        <div><div class="title">${escapeHtml(d.name ?? d.model ?? d.serial)}</div>
        <div class="meta">${escapeHtml(d.serial)} · ${escapeHtml(d.transport ?? '')} · ${escapeHtml(d.state ?? '')}</div></div>
      </div>`).join('')
    : `<div class="empty" style="margin:6px 0">当前没有 adb 可见设备。插上 USB 或开启无线调试后这里会自动出现。</div>`;
  const pairHtml = pairable.length
    ? `<div class="sub" style="margin-top:16px">通过无线调试广播出来的待配对设备 · ${pairable.length} 台</div>
       <div style="margin-top:8px">
         ${pairable.map(p => `<div class="dev-row" style="grid-template-columns:1fr auto">
            <div><div class="title">${escapeHtml(p.serviceName)}</div>
            <div class="meta">${escapeHtml(p.host)}:${p.port} · ${p.kind === 'pairing' ? '需配对码' : '已配对可直连'}${p.known ? ' · 已保存' : ''}</div></div>
            <div class="actions"><button class="primary" data-pair="${escapeHtml(JSON.stringify({ host: p.host, port: p.port, kind: p.kind, serviceName: p.serviceName }))}">${p.kind === 'pairing' ? '用配对码配对' : '一键连接'}</button></div>
          </div>`).join('')}
       </div>`
    : '';
  const errBanner = adbError
    ? `<div class="empty" style="border-color:#fecaca;color:var(--err);margin-top:10px;text-align:left">
         <b>⚠ adb 不可用 — 这就是「设备一直是 0 台」的真正原因</b><br>
         ${escapeHtml(adbError)}<br>
         <span style="font-size:11.5px;color:var(--ink-3)">点下方「运行诊断」看 adb 原始输出；最常见的原因是控制台进程的 PATH 里没有 adb（platform-tools 没装或没加 PATH）。如果是沙箱里跑的服务，请改用你本地 shell 启动 <code>node lib/cli.js serve --port 8899</code>。</span>
       </div>`
    : (mdnsError
        ? `<div class="empty" style="border-color:#fed7aa;color:#9a3412;margin-top:10px;text-align:left">
             <b>mDNS 探测失败</b> · ${escapeHtml(mdnsError)}<br>
             <span style="font-size:11.5px;color:var(--ink-3)">通常是电脑没装 Bonjour（Windows）或 adb mDNS 被防火墙拦了；可改用「设备」面板里的「手动 WiFi」或「扫二维码」方式。</span>
           </div>`
        : '');
  out.innerHTML = `
    <div class="kv-grid">
      <div><span>连接模式</span><b>${escapeHtml(String(mode))}</b></div>
      <div><span>状态</span><b>${escapeHtml(String(stateLabel))}</b></div>
      <div><span>当前端点</span><b class="mono">${escapeHtml(String(endpoint))}</b></div>
    </div>
    ${errBanner}
    <div class="sub" style="margin-top:18px">已连接的 adb 设备 · ${devices.length} 台</div>
    <div class="dev-list" style="margin-top:8px">${devHtml}</div>
    ${pairHtml}
    <div class="card" style="margin-top:14px;background:var(--surface-2);box-shadow:none">
      <div style="display:flex;align-items:center;gap:10px">
        <h3 style="margin:0;font-size:14px">运行诊断</h3>
        <div style="flex:1"></div>
        <button class="ghost" id="conn-diag-go">运行诊断</button>
      </div>
      <div class="sub" style="margin-top:4px">执行 <code>adb version</code> / <code>adb devices -l</code> / <code>adb mdns services</code>，把原始输出贴在这里。设备一直是 0 时先看这段。</div>
      <div id="conn-diag-out" style="margin-top:8px"></div>
    </div>
  `;
  out.querySelectorAll('[data-pair]').forEach(btn => {
    btn.addEventListener('click', async () => {
      let p; try { p = JSON.parse(btn.dataset.pair); } catch { return; }
      await pairDiscoveredDevice(p);
      await refreshConnStatus();
    });
  });
  document.getElementById('conn-diag-go')?.addEventListener('click', runConnDiagnose);
}

async function runConnDiagnose() {
  const out = document.getElementById('conn-diag-out');
  if (!out) return;
  out.innerHTML = '<div class="sub">运行中…</div>';
  const r = await call('wlan-connection.diagnose');
  if (!r.ok) {
    out.innerHTML = `<div class="empty" style="color:var(--err);text-align:left">诊断失败：${escapeHtml(r.error)}</div>`;
    return;
  }
  const d = r.value ?? {};
  const summary = d.adbAvailable
    ? `<div style="color:var(--ok)"><b>✓ adb 可用</b> · binary=<code>${escapeHtml(String(d.binary ?? ''))}</code> · 探测时间 ${escapeHtml(String(d.at ?? ''))}</div>`
    : `<div style="color:var(--err)"><b>✗ adb 不可用</b>${d.binary ? ' · binary=<code>' + escapeHtml(String(d.binary)) + '</code>' : ''}</div>
       ${d.reason ? `<div class="sub" style="margin-top:4px;text-align:left">${escapeHtml(String(d.reason))}</div>` : ''}`;
  const block = (label, cmd, v) => {
    if (v === null || v === undefined) {
      return `<div style="margin-top:8px"><b>${escapeHtml(label)}</b> · <code>${escapeHtml(cmd)}</code> · <i>未执行</i></div>`;
    }
    const text = `${v.stdout ?? ''}${v.stderr ? '\n[stderr]\n' + v.stderr : ''}\n[exit ${v.code}]`.trim();
    return `<details style="margin-top:6px" open>
      <summary><b>${escapeHtml(label)}</b> · <code>${escapeHtml(cmd)}</code> · exit=${v.code}</summary>
      <pre class="mono" style="background:var(--surface);padding:8px;border-radius:6px;white-space:pre-wrap;margin:4px 0 0;font-size:12px">${escapeHtml(text)}</pre>
    </details>`;
  };
  out.innerHTML = `${summary}${block('adb version', 'adb version', d.version)}${block('adb devices -l', 'adb devices -l', d.devices)}${block('adb mdns services', 'adb mdns services', d.mdns)}`;
}

modules['scheduler'] = {

        <div class="field grow"><label>时间表达式（ISO 时间 / 毫秒间隔 / Cron）</label><input name="at" placeholder="2099-01-01T00:00:00+08:00 或 30000 或 */5 * * * *"></div>
        <div class="field"><label>目标</label><select name="targetType"><option value="snippet">指令</option><option value="template">模板</option></select></div>
        <div class="field"><label>目标 ID / 别名</label><input name="target" required placeholder="指令别名 或 模板 id"></div>
        <div class="field"><label>变量（仅模板，JSON）</label><input name="variables" placeholder='{"pkg":"com.android.settings"}'></div>
        <div><label>&nbsp;</label><button class="primary" type="submit">创建</button></div>
      </form>
      <div id="list-scheduler" style="margin-top:14px"></div>
    </div>`;
  },
  bind(s) {
    document.getElementById('form-scheduler').addEventListener('submit', async e => {
      e.preventDefault();
      const data = readForm(e.target);
      const targetType = data.targetType;
      const targetStr = data.target;
      delete data.targetType; delete data.target;
      let target;
      if (targetType === 'snippet') target = { type: 'snippet', alias: targetStr };
      else target = { type: 'template', templateId: targetStr, ...(data.variables ? { variables: safeJson(data.variables) } : {}) };
      const schedule = data.kind === 'interval' ? { kind: 'interval', ms: Number(data.at) } : data.kind === 'cron' ? { kind: 'cron', expression: data.at } : { kind: 'once', at: data.at };
      const r = await call('scheduler.create', { name: data.name, schedule, target });
      if (!r.ok) return toast('创建失败：' + r.error, 'err');
      toast('已创建', 'ok');
      renderList();
    });

      box.innerHTML = `<table class="table"><thead><tr><th>名称</th><th>类型</th><th>下次执行</th><th>目标</th><th></th></tr></thead>

            <button class="danger" data-del="${escapeHtml(t.id)}">删除</button>
          </td>
        </tr>`).join('')}</tbody></table>`;

/* ====================================================================== */
/* Utilities                                                                */
/* ====================================================================== */
function csvList(s) {
  return (s ?? '').split(/[,，;；\s]+/).map(t => t.trim()).filter(Boolean);
}
function safeJson(s) {
  if (!s) return undefined;
  try { return JSON.parse(s); } catch { return undefined; }
}

/* ====================================================================== */
/* Bootstrap                                                                */
/* ====================================================================== */
async function bootstrap() {
  state.status = await getStatus();
  state.currentProject = state.status.activeProjectId;
  if (state.status.projects) state.projects = state.status.projects;
  else {
    const r = await call('project-group.list');
    if (r.ok) state.projects = r.value?.groups ?? [];
  }
  renderProjectSelect();
  document.getElementById('project-select').addEventListener('change', async (e) => {
    const id = e.target.value;
    const r = await call('project-group.switch', { id });
    if (!r.ok) return toast('切换失败：' + r.error, 'err');
    state.currentProject = id;
    toast('已切换项目组', 'ok');
    renderStrip(); renderCenter(); if (state.view !== 'dashboard') renderPanel();
  });
  renderStrip();
  renderCenter();
  await refreshDevices();
  startScreenshotPolling();
  startDevicePolling();
}

// Esc 关闭模块弹窗
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && state.view !== 'dashboard') closeModule();
});

bootstrap().catch(error => {
  console.error('bootstrap failed', error);
  toast('启动失败：' + error.message, 'err');
});
</script>
